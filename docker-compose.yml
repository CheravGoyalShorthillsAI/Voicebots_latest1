version: '3.8'

services:
  voicebot:
    build: .
    container_name: voicebot_latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - DEBUG=false
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./conversations:/app/conversations
    networks:
      - voicebot_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - redis
      - postgres
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.voicebot.rule=Host(`voicebot.local`)"
      - "traefik.http.services.voicebot.loadbalancer.server.port=8000"

  redis:
    image: redis:7-alpine
    container_name: voicebot_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - voicebot_network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-defaultpassword}

  postgres:
    image: postgres:15-alpine
    container_name: voicebot_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-voicebot}
      - POSTGRES_USER=${POSTGRES_USER:-voicebot_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - voicebot_network

  nginx:
    image: nginx:alpine
    container_name: voicebot_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - voicebot_network
    depends_on:
      - voicebot

  # Monitoring and logging
  prometheus:
    image: prom/prometheus:latest
    container_name: voicebot_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - voicebot_network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

networks:
  voicebot_network:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  prometheus_data: