<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Speech Recognition</title>
    <style>
        .status { margin-bottom: 10px; padding: 5px; border-radius: 4px; }
        .connected { background: #d4edda; color: #155724; }
        .disconnected { background: #f8d7da; color: #721c24; }
        .section { margin-top: 20px; border: 1px solid #ccc; padding: 10px; }
        .section h3 { margin-top: 0; }
        .transcript, .response { margin: 5px 0; padding: 5px; }
        .transcript { background: #f0f8ff; }
        .response { background: #fff0f5; }
    </style>
</head>
<body>
    <h1>Real-time Speech Recognition</h1>
    <div id="status" class="status disconnected">Disconnected</div>
    <button id="startBtn">Start Recording</button>
    <button id="stopBtn" disabled>Stop Recording</button>
    <div id="transcript" class="section">
        <h3>Transcribed Speech</h3>
    </div>
    <div id="llmResponse" class="section">
        <h3>Assistant Response</h3>
    </div>
 
    <script>
        let mediaStream;
        let audioContext;
        let processor;
        let websocket;
        let nextPlaybackTime = 0;
        let currentSource = null; // Track current audio source
        let isPlaying = false; // Track playback state
        let analyser; // For detecting speech
        let pendingSources = []; // Track all scheduled sources
    
        function updateStatus(text, isConnected) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = text;
            statusDiv.className = `status ${isConnected ? 'connected' : 'disconnected'}`;
        }
    
        async function initAudio() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            mediaStream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
            });
    
            const sourceNode = audioContext.createMediaStreamSource(mediaStream);
            processor = audioContext.createScriptProcessor(1024, 1, 1);
            
            // Set up analyser for speech detection
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;
            sourceNode.connect(analyser);
            analyser.connect(processor);
            processor.connect(audioContext.destination);
    
            return processor;
        }
    
        function float32ToInt16(buffer) {
            const int16Array = new Int16Array(buffer.length);
            for (let i = 0; i < buffer.length; i++) {
                int16Array[i] = Math.max(-1, Math.min(1, buffer[i])) * 32767;
            }
            return int16Array;
        }
    
        function int16ToFloat32(int16Array) {
            const float32Array = new Float32Array(int16Array.length);
            for (let i = 0; i < int16Array.length; i++) {
                float32Array[i] = int16Array[i] / 32767;
            }
            return float32Array;
        }
    
        function stopCurrentPlayback() {
            // Stop all scheduled sources
            pendingSources.forEach(source => {
                try {
                    source.stop();
                } catch (e) {
                    console.warn("Error stopping source:", e);
                }
            });
            pendingSources = [];
            if (currentSource) {
                try {
                    currentSource.stop();
                } catch (e) {
                    console.warn("Error stopping current source:", e);
                }
                currentSource = null;
            }
            isPlaying = false;
            nextPlaybackTime = audioContext.currentTime;
        }
    
        function schedulePlayback(audioData) {
            const float32Array = int16ToFloat32(new Int16Array(audioData));
            const buffer = audioContext.createBuffer(1, float32Array.length, audioContext.sampleRate);
            buffer.copyToChannel(float32Array, 0);
    
            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.connect(audioContext.destination);
    
            const bufferDuration = buffer.duration;
            const currentTime = audioContext.currentTime;
    
            if (nextPlaybackTime < currentTime) {
                nextPlaybackTime = currentTime + bufferDuration * 0.1;
            }
    
            source.start(nextPlaybackTime);
            nextPlaybackTime += bufferDuration;
            currentSource = source;
            isPlaying = true;
            pendingSources.push(source);
    
            source.onended = () => {
                pendingSources = pendingSources.filter(s => s !== source);
                if (currentSource === source) {
                    currentSource = null;
                    isPlaying = pendingSources.length > 0;
                }
            };
        }
    
        function appendMessage(divId, text, className) {
            const div = document.getElementById(divId);
            const p = document.createElement('p');
            p.className = className;
            p.textContent = text;
            div.appendChild(p);
            if (div.children.length > 20) {
                div.removeChild(div.firstChild);
            }
            div.scrollTop = div.scrollHeight;
        }
    
        document.getElementById('startBtn').addEventListener('click', async () => {
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
    
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            websocket = new WebSocket(`${protocol}//${window.location.host}/ws`);
    
            websocket.onopen = () => updateStatus("Connected", true);
            websocket.onclose = () => updateStatus("Disconnected", false);
    
            websocket.onmessage = (event) => {
                if (typeof event.data === 'string') {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.type === 'transcript') {
                            appendMessage('transcript', data.text, 'transcript');
                        } else if (data.type === 'llm_response') {
                            appendMessage('llmResponse', data.text, 'response');
                        } else if (data.type === 'pause_playback') {
                            stopCurrentPlayback();
                            appendMessage('llmResponse', data.text, 'response');
                        }
                    } catch (e) {
                        console.warn("Invalid JSON received:", e);
                    }
                } else {
                    // Handle binary audio data
                    event.data.arrayBuffer().then(buffer => {
                        schedulePlayback(buffer);
                    });
                }
            };
    
            const processor = await initAudio();
            processor.onaudioprocess = (event) => {
                if (websocket.readyState === WebSocket.OPEN) {
                    const audioData = event.inputBuffer.getChannelData(0);
                    const int16Data = float32ToInt16(audioData);
                    websocket.send(int16Data.buffer);
                }
            };
        });
    
        document.getElementById('stopBtn').addEventListener('click', () => {
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
    
            stopCurrentPlayback();
            if (websocket) websocket.close();
            if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
            if (audioContext) audioContext.close();
            nextPlaybackTime = 0;
            updateStatus("Disconnected", false);
        });
    </script>
</body>
</html>
